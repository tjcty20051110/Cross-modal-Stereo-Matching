# ==============================================================================
# Deep-learning feature configuration (Siamese CNN + SGM)
# ==============================================================================
# Uses a trained Siamese network to extract modality-invariant features,
# then applies SGM aggregation and WTA disparity estimation.
# ==============================================================================

max_disparity: 128
feature_method: DL_FEATURE
cost_metric: COSINE_SIMILARITY      # 32-channel normalized features -> dot product
aggregation_method: SGM

sgm:
  num_directions: 8
  p1: 10
  p2: 120

post_processing:
  enable_lr_check: true
  enable_hole_filling: true
  lr_threshold: 1.0

depth:
  depth_max_meter: 100.0

preprocessing:
  enable_clahe: true
  clahe_clip_limit: 4
  clahe_tile_size: 8
  enable_gradient_alignment: false

dl:
  use_dl_features: true
  fallback_to_handcraft: true       # Fall back to Census if model loading fails
  inference_backend: LIBTORCH
  model_weights_path: "./models/siamese_resnet.pt"
  use_gpu: false

io:
  manifest_path: "./data/MS2/manifest.csv"
  output_dir: "./output/dl"

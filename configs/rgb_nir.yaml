# ==============================================================================
# Cross-modal: RGB_left (reference) + NIR_right (matching)
# Baseline: ~3.6 mm  |  Focal: 764.5 px (RGB camera)
# NOTE: Extremely small baseline — disparity < 1px for most scene depths.
# ==============================================================================

max_disparity: 16               # Very small range due to tiny baseline
feature_method: CENSUS
cost_metric: CENSUS_HAMMING
aggregation_method: SGM

sgm:
  num_directions: 8
  p1: 5
  p2: 40

post_processing:
  enable_lr_check: true
  enable_hole_filling: true
  lr_threshold: 1.0

depth:
  depth_max_meter: 100.0

preprocessing:
  enable_clahe: true
  clahe_clip_limit: 4
  clahe_tile_size: 8
  enable_gradient_alignment: false

dl:
  use_dl_features: false
  fallback_to_handcraft: true
  inference_backend: LIBTORCH
  model_weights_path: ""
  use_gpu: false

io:
  manifest_path: "./data/MS2/manifest_rgb_nir.csv"
  output_dir: "./output/rgb_nir"
